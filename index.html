<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Protocolo Jane</title>
<meta name="description" content="Entrenamiento de mentalismo en 52 sesiones — app personal de Cris.">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1b3238">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Jane">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Libre+Franklin:wght@600;700;800&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600;8..60,700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div id="app">
  <div class="topbar">
    <div class="brand"><span class="brand-dot"></span><h1>Protocolo Jane</h1></div>
    <div class="stats">
      <div class="pill-stat streak"><span class="ico">🔥</span><span id="topStreak">0</span></div>
      <div class="pill-stat xp"><span class="ico">⭐</span><span id="topXp">0</span></div>
    </div>
  </div>

  <div class="offline-banner" id="offlineBanner">Sin conexión · sigues viendo tu progreso guardado</div>

  <div class="screen active" id="screen-camino">
    <div id="homeHero"></div>
    <div id="homePath"></div>
  </div>

  <div class="screen" id="screen-progreso"></div>
  <div class="screen" id="screen-memoria"></div>
  <div class="screen" id="screen-guia"></div>

  <div class="tabbar">
    <button class="tab-btn active" id="tab-camino"><span class="tab-ico">🧭</span><span class="tab-label">Camino</span></button>
    <button class="tab-btn" id="tab-progreso"><span class="tab-ico">📊</span><span class="tab-label">Progreso</span></button>
    <button class="tab-btn" id="tab-memoria"><span class="tab-ico">🏛️</span><span class="tab-label">Memoria</span></button>
    <button class="tab-btn" id="tab-guia"><span class="tab-ico">📖</span><span class="tab-label">Guía</span></button>
  </div>
</div>

<div class="lesson" id="lesson">
  <div class="lesson-top">
    <button class="lesson-close" id="lessonCloseBtn">✕</button>
    <div class="lesson-progress" id="lessonProgress"></div>
    <span class="lesson-tagpill" id="lessonTagPill"></span>
  </div>
  <div class="lesson-body" id="lessonBody"></div>
  <div class="lesson-bottom" id="lessonBottom"></div>
</div>

<div class="install-toast" id="installToast">
  <p id="installToastText"></p>
  <button class="install-go" id="installGoBtn">Instalar</button>
  <button class="install-x" id="installXBtn">✕</button>
</div>

<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
